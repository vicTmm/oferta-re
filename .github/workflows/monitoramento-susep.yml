name: Monitoramento SUSEP

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: monitoramento-susep
  cancel-in-progress: false

jobs:
  monitoramento:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Executar monitoramento
        id: pipeline
        run: python -m src.main
      - name: Sincronizar execução com Supabase quando configurado
        if: ${{ always() && !cancelled() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_INGESTION_TOKEN: ${{ secrets.SUPABASE_INGESTION_TOKEN }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_INGESTION_TOKEN" ]; then
            python -m src.publicacao_supabase
          elif [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_INGESTION_TOKEN" ]; then
            echo "::error::Configuração Supabase incompleta."
            exit 1
          else
            echo "::notice::Supabase ainda não vinculado; resultados locais preservados."
          fi
      - name: Publicar artefatos públicos
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: monitoramento-susep
          retention-days: 30
          path: |
            data/raw/
            data/processed/
            data/history/
            outputs/reports/
            outputs/runs/
            outputs/logs/
      - name: Versionar histórico, relatórios e estado da coleta
        if: ${{ always() && !cancelled() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history outputs/reports outputs/runs
          if git diff --cached --quiet; then
            echo "Nenhum resultado novo para versionar."
          else
            git commit -m "Atualiza monitoramento SUSEP"
            git push
          fi
